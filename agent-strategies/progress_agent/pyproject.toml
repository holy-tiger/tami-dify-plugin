[project]
name = "progress_agent"
version = "0.0.2"
description = "Dify agent strategy with variable-backed iteration budgets and progress checkpoints"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["dify_plugin>=0.10.2,<0.11"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.9"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["strategies", "provider"]
